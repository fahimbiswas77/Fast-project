<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Gallery & Order</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #f4f4f9;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .main-image {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 8px;
    }
    .thumbnails {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      overflow-x: auto;
    }
    .thumbnail {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 5px;
      cursor: pointer;
      border: 2px solid transparent;
    }
    .thumbnail.active {
      border-color: #007bff;
    }
    .order-form {
      margin-top: 20px;
    }
    .order-form input, .order-form button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .order-form button {
      background-color: #28a745;
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>

<div class="container">
  <img id="featured" class="main-image" src="17871818581464.jpg" alt="Product Image">

  <div class="thumbnails">
    <img class="thumbnail active" src="17871818581464.jpg" onclick="changeImage(this)">
    <img class="thumbnail" src="IMG-20260807-WA0000.jpg" onclick="changeImage(this)">
  </div>

  <div class="order-form">
    <h3>অর্ডার করার জন্য তথ্য দিন</h3>
    <form onsubmit="sendToWhatsApp(event)">
      <label for="size">সাইজ সিলেক্ট করুন:</label>
<select id="size" name="size" required>
  <option value="">সাইজ বেছে নিন</option>
  <option value="S">S</option>
  <option value="M">M</option>
  <option value="L">L</option>
  <option value="XL">XL</option>
  <option value="XXL">XXL</option>
  <option value="XXXL">XXXL</option>
</select>

<label for="color">কালার সিলেক্ট করুন:</label>
<select id="color" name="color" required>
  <option value="">কালার বেছে নিন</option>
  <option value="Red">লাল (Red)</option>
  <option value="Black">কালো (Black)</option>
  <option value="White">সাদা (White)</option>
  <option value="Blue">নীল (Blue)</option>
  <option value="Green">সবুজ (Green)</option>
  <option value="Purple">বেগুনি (Purple)</option>
  <option value="Royal Blue">রয়্যাল ব্লু (Royal Blue)</option>
</select>

      <input type="text" id="customer_name" placeholder="আপনার নাম" required>
      <input type="tel" id="customer_phone" placeholder="মোবাইল নম্বর" required>
      <input type="text" id="customer_address" placeholder="ঠিকানা" required>
      <button type="submit">অর্ডার নিশ্চিত করুন</button>
    </form>
  </div>
</div>
<script>
  function changeImage(element) {
    // বড় ছবি পরিবর্তন
    document.getElementById('featured').src = element.src;

    // একটিভ বর্ডার পরিবর্তন
    let thumbnails = document.querySelectorAll('.thumbnail');
    thumbnails.forEach(thumb => thumb.classList.remove('active'));
    element.classList.add('active');
  }
  function sendToWhatsApp(event) {
    event.preventDefault();

    let myNumber = "8801612260908";

    let name = document.getElementById('customer_name').value;
    let phone = document.getElementById('customer_phone').value;
    let address = document.getElementById('customer_address').value;
    let size = document.getElementById('size').value;
    let color = document.getElementById('color').value;

    let message = `নতুন টি-শার্ট অর্ডার এসেছে!%0A` +
                  `নাম: ${name}%0A` +
                  `মোবাইল: ${phone}%0A` +
                  `ঠিকানা: ${address}%0A` +
                  `সাইজ: ${size}%0A` +
                  `কালার: ${color}`;

    let url = `https://wa.me/${myNumber}?text=${message}`;
    window.open(url, '_blank');
}
</script>

</body>
</html>
